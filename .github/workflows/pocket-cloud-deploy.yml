name: Deploy POCKET Cloud Account
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pocket-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install and test
        working-directory: cloudflare/pocket-cloud
        run: |
          npm install --no-fund --no-audit
          npm test
      - name: Build production Wrangler config
        working-directory: cloudflare/pocket-cloud
        env:
          D1_ID: ${{ secrets.POCKET_D1_DATABASE_ID }}
        run: |
          test -n "$D1_ID"
          python - <<'PY'
          import os
          from pathlib import Path
          src=Path('wrangler.jsonc').read_text()
          Path('wrangler.production.jsonc').write_text(src.replace('REPLACE_WITH_D1_DATABASE_ID',os.environ['D1_ID']))
          PY
      - name: Apply D1 migrations
        working-directory: cloudflare/pocket-cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply pocket-cloud --remote --config wrangler.production.jsonc
      - name: Deploy Worker and static assets
        working-directory: cloudflare/pocket-cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.jsonc
